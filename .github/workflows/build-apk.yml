name: Build English Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q English-Journey-Mentor-GitHub-Ready.zip -d project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find project -type f -name "app.json" -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: project/English-Journey-Mentor
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        working-directory: project/English-Journey-Mentor/artifacts/english-journey
        run: |
          pnpm exec expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: project/English-Journey-Mentor/artifacts/english-journey/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Journey-APK
          path: project/English-Journey-Mentor/artifacts/english-journey/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
