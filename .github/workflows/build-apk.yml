name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Find and extract the ZIP project
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          PROJECT_DIR=$(find extracted-project -type f -name "package.json" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # 4. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # 5. Check versions
      - name: Check Node and pnpm
        run: |
          node --version
          pnpm --version

      # 6. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      # 8. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      # 9. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 10. Install project dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm install --frozen-lockfile

      # 11. Generate Android project
      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm exec expo prebuild --platform android --non-interactive

      # 12. Make Gradle executable
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x android/gradlew

      # 13. Build release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          ./gradlew assembleRelease --no-daemon

      # 14. Find APK
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK files:"
          find android -type f -name "*.apk" -print

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: English-Journey-APK
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
