name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "English-Journey-Mentor-GitHub-Ready.zip" -d extracted

      - name: Find project folder
        id: project
        run: |
          PROJECT=$(find extracted -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project folder: $PROJECT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.PROJECT }}
        run: pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.PROJECT }}
        run: |
          if [ -f "scripts/build-apk.sh" ]; then
            chmod +x scripts/build-apk.sh
            ./scripts/build-apk.sh
          elif [ -f "scripts/build-apk.js" ]; then
            node scripts/build-apk.js
          elif [ -f "BUILD-APK.md" ]; then
            echo "BUILD-APK.md found"
            echo "No automatic build script found."
            exit 1
          else
            echo "No APK build script found."
            exit 1
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Journey-APK
          path: ${{ steps.apk.outputs.APK }}
